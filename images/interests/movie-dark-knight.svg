<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Night city skyline under a glowing searchlight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="0.6" stop-color="#16233a"/><stop offset="1" stop-color="#2a3b57"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c8" stop-opacity="0.95"/><stop offset="0.35" stop-color="#f5d76e" stop-opacity="0.45"/><stop offset="1" stop-color="#f5d76e" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c8" stop-opacity="0.55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#sky)"/>
  <circle cx="200" cy="120" r="150" fill="url(#glow)"/>
  <circle cx="200" cy="120" r="46" fill="#fff6c8"/>
  <polygon points="200,120 120,380 280,380" fill="url(#beam)"/>
