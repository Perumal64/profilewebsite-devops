    <rect x="76" y="320" width="50" height="180"/><rect x="120" y="270" width="36" height="230"/>
    <rect x="150" y="340" width="60" height="160"/><rect x="204" y="290" width="44" height="210"/>
    <rect x="242" y="235" width="40" height="265"/><rect x="278" y="330" width="52" height="170"/>
